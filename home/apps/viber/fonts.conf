<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- This file is used to override the system fontconfig settings for Viber.
	     Inherits the system fontconfig settings and adds custom rules. -->
	<include>/etc/fonts/fonts.conf</include>
	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="family">
					<!-- This is a workaround for Viber mishandling emoji fonts and using them for rendering numbers in the app's UI -->
					<string>Noto Color Emoji</string>
				</patelt>
			</pattern>
		</rejectfont>
	</selectfont>
</fontconfig>
