set -g bell-action any
set -g repeat-time 325
set -g set-clipboard on
set -g visual-bell off

setw -g alternate-screen on
setw -g automatic-rename off
setw -g monitor-activity on
setw -g xterm-keys on

set -g set-titles on
set -g set-titles-string '#T - #S:#I:#W #{session_alerts}'

set -g buffer-limit 30

unbind C-z

unbind o
bind C-s select-pane -t :.+

unbind Up
unbind Down
unbind Left
unbind Right
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right
bind -r C-M-k resize-pane -U 5
bind -r C-M-j resize-pane -D 5
bind -r C-M-h resize-pane -L 5
bind -r C-M-l resize-pane -R 5

# While the navigator is open, these window switches bring it into the target window first (@navigator-switch in
# abilities/tmux.navigator.conf); a window number that does not exist falls through to select-window and its message.
bind -n M-1 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},1},1,}}}' { run-shell -t :1 -C '#{E:@navigator-switch}' } { select-window -t 1 }
bind -n M-2 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},2},1,}}}' { run-shell -t :2 -C '#{E:@navigator-switch}' } { select-window -t 2 }
bind -n M-3 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},3},1,}}}' { run-shell -t :3 -C '#{E:@navigator-switch}' } { select-window -t 3 }
bind -n M-4 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},4},1,}}}' { run-shell -t :4 -C '#{E:@navigator-switch}' } { select-window -t 4 }
bind -n M-5 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},5},1,}}}' { run-shell -t :5 -C '#{E:@navigator-switch}' } { select-window -t 5 }
bind -n M-6 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},6},1,}}}' { run-shell -t :6 -C '#{E:@navigator-switch}' } { select-window -t 6 }
bind -n M-7 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},7},1,}}}' { run-shell -t :7 -C '#{E:@navigator-switch}' } { select-window -t 7 }
bind -n M-8 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},8},1,}}}' { run-shell -t :8 -C '#{E:@navigator-switch}' } { select-window -t 8 }
bind -n M-9 if -F '#{&&:#{E:@navigator-switching},#{W:#{?#{==:#{window_index},9},1,}}}' { run-shell -t :9 -C '#{E:@navigator-switch}' } { select-window -t 9 }

# Cycle through windows like browser tabs, wrapping around and stepping past empty section headers,
# with the navigator open or closed (@navigator-next-window and @navigator-previous-window in abilities/tmux.navigator.conf).
# Backward is C-BTab because tmux names Shift+Tab "BTab", so Ctrl+Shift+Tab is Ctrl+BTab (not Ctrl+Shift+Tab).
# prefix n and p, tmux's own next-window and previous-window, do the same.
bind -n C-Tab  if -F '#{E:@navigator-switching}' { run-shell -C 'run-shell -t :#{E:@navigator-next-window} -C "##{E:@navigator-switch}"' } { run-shell -C 'select-window -t :#{E:@navigator-next-window}' }
bind -n C-BTab if -F '#{E:@navigator-switching}' { run-shell -C 'run-shell -t :#{E:@navigator-previous-window} -C "##{E:@navigator-switch}"' } { run-shell -C 'select-window -t :#{E:@navigator-previous-window}' }
bind n         if -F '#{E:@navigator-switching}' { run-shell -C 'run-shell -t :#{E:@navigator-next-window} -C "##{E:@navigator-switch}"' } { run-shell -C 'select-window -t :#{E:@navigator-next-window}' }
bind p         if -F '#{E:@navigator-switching}' { run-shell -C 'run-shell -t :#{E:@navigator-previous-window} -C "##{E:@navigator-switch}"' } { run-shell -C 'select-window -t :#{E:@navigator-previous-window}' }

# Drag-and-drop window reordering on the status bar (grab on click, swap on release).
# Workaround for tmux 3.4+ where MouseDrag1Status reports source=target.
# See https://github.com/tmux/tmux/issues/4549
bind -n MouseDown1Status   select-window \; set -F @drag_window '#{window_id}'
bind -n MouseDragEnd1Status run -C 'swap-window -d -s#{@drag_window}'

unbind -n C-MouseDown1Pane
unbind -n C-MouseDown1Status

unbind '"'
unbind %
# While the navigator is open, a new window goes after the last one, as Ctrl+T puts a browser tab at the end of the strip;
# otherwise tmux takes the lowest free index, which can drop it between existing windows in the navigator's list.
# In the navigator's session the window opens out of sight with a placeholder column, and the switch keys' swap
# (@navigator-switch in tmux.navigator.conf) brings the navigator in before the switch: the window appears once, at its
# final width, instead of full width first.
bind c {
	if -F '#{&&:#{E:@navigator-switching},#{e|>=:#{window_width},#{@navigator-min-width}}}' {
		run 'tmux new-window -d -a -t "#{session_name}:{end}" -n "$(@nameWindow@)" \; split-window -hbf -d -l #{@navigator-width} -t "#{session_name}:{end}" @navigatorPlaceholder@ \; run-shell -t "#{session_name}:{end}" -C "##{E:@navigator-switch}"'
	} {
		if -F '#{@navigator-open}' {
			run 'tmux new-window -a -t "{end}" -n "$(@nameWindow@)"'
		} {
			run 'tmux new-window -n "$(@nameWindow@)"'
		}
	}
}
bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'

# tmux's own prefix , and prefix $ put the typed name into a { } block, which stores an apostrophe as '\\'' and escapes
# the name again on every rename; given as a string, the template keeps quotes, $ and commas as typed.
bind , command-prompt -I '#W' "rename-window -- '%%'"
bind '$' command-prompt -I '#S' "rename-session -- '%%'"

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# In a Claude Code pane the copy bindings below pipe the selection through tmux-claude-copy (claude-copy/), which drops the
# glowup mod's bars and the padding beside them and copies the result itself; -C -P keep tmux from also copying the raw text.
# Elsewhere each does what it did before. Double-click (a word) and D (the rest of a line) start inside a row's text: tmux's own.
set -g @claude-copy "@claudeCopy@ --socket '#{socket_path}' --client '#{client_name}' --mode '#{selection_mode}' --rectangle '#{rectangle_toggle}' --start '#{selection_start_x}' '#{selection_start_y}' --end '#{selection_end_x}' '#{selection_end_y}'"
# --type skips wl-copy's type guess, which waits on the GVfs metadata daemon; timeout stops a copy that never finishes.
bind -T copy-mode-vi y     if -F '#{@claude-pane}' { send -X copy-pipe -C -P '#{E:@claude-copy} --wl-copy' } { send -X copy-pipe 'timeout 5 wl-copy --type text/plain' }
bind -T copy-mode-vi Enter if -F '#{@claude-pane}' { send -X copy-pipe-and-cancel -C -P '#{E:@claude-copy}' } { send -X copy-pipe-and-cancel }
bind -T copy-mode-vi C-j   if -F '#{@claude-pane}' { send -X copy-pipe-and-cancel -C -P '#{E:@claude-copy}' } { send -X copy-pipe-and-cancel }
bind -T copy-mode-vi MouseDragEnd1Pane if -F '#{@claude-pane}' { send -X copy-pipe-and-cancel -C -P '#{E:@claude-copy}' } { send -X copy-pipe-and-cancel }
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; if -F '#{@claude-pane}' { send -X copy-pipe-and-cancel -C -P '#{E:@claude-copy}' } { send -X copy-pipe-and-cancel }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H ; send -X select-line ; run -d 0.3 ; if -F '#{@claude-pane}' { send -X copy-pipe-and-cancel -C -P '#{E:@claude-copy}' } { send -X copy-pipe-and-cancel } }

bind ] run 'tmux set-buffer -- "$(wl-paste --no-newline)" && tmux paste-buffer -d'

set -g mode-style                     fg=colour16,bg=colour220
# While the navigator is open in the window on screen, the bar beside the pane takes a faint tint (tmux.navigator.conf).
set -g status-style                   '#{?#{&&:#{@navigator-open},#{E:@navigator-here-width}},fg=colour247 bg=#0c0c0c,fg=colour247}'

set -g pane-border-indicators         both
set -g pane-border-style              fg=colour238
set -g pane-active-border-style       fg=colour248
set -g message-style                  fg=colour39,fill=terminal

# tmux 3.8 colours its own screens (copy-mode search matches, menus, the prompt, the clock) from a built-in palette;
# terminal draws them in the terminal's ANSI colours, as 3.7b did.
set -s theme                          terminal

# Titles in the top border of floating panes only. The floats/ scripts set @float-title-bold and @float-title-rest to read like a popup title;
# any other floating pane shows its pane title.
set -g pane-border-status             top-floating
set -g pane-border-format             '#{?#{||:#{@float-title-bold},#{@float-title-rest}}, #{?#{@float-title-bold},#[bold]#{@float-title-bold}#[nobold] ,}#{@float-title-rest} , #{pane_title} }'

# tmux 3.8 underlines the current window's name by default.
setw -g window-status-current-style   default
setw -g window-status-activity-style  fg=colour251,bold
setw -g window-status-bell-style      fg=colour251,bold

setw -g status-left                   '#{?@navigator-open,#{E:@navigator-status-left},#{?#{==:#S,default},,#[fg=colour252]#[bg=colour244] #S #[fg=colour244]#[bg=colour232] }}'
# While the navigator (prefix Tab) is open, the window list makes way for its widgets, and status-left continues its
# border down through the bar (abilities/tmux.navigator.conf).
setw -g status-right                  '#{?@navigator-open,#{E:@navigator-widgets} ,}#{?#{==:#h,@machineName@},, #[fg=colour244]#[bg=colour232]#[fg=colour252]#[bg=colour244] #h }'
setw -g window-status-format          "#{?@navigator-open,, #I│ #{?#{E:@claude-window-state},#{?#{==:#{E:@claude-window-state},blocked},#[fg=#ff0000]●#[fg=#9e9e9e] ,#{?#{==:#{E:@claude-window-state},working},#[fg=#ff9300]●#[fg=#9e9e9e] ,#{?#{==:#{E:@claude-window-state},unread},#[fg=#00ff00]●#[fg=#9e9e9e] ,#[fg=#4cb24c]●#[fg=#9e9e9e] }}},}#W }"
setw -g window-status-current-format  "#{?@navigator-open,,#[fg=#000000]#[bg=#00afff] #I│ #{?#{E:@claude-window-state},#{?#{==:#{E:@claude-window-state},blocked},#[fg=#cc0000]●,#{?#{==:#{E:@claude-window-state},working},#[fg=#cc7500]●,#{?#{==:#{E:@claude-window-state},unread},#[fg=#00cc00]●,#[fg=#3d8e3d]●}}}#[fg=#000000] ,}#W #[fg=#00afff]#[bg=#080808]}"

set -g status-left-length  64
set -g status-right-length 64

set -ga terminal-features ",*:hyperlinks"
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -g allow-passthrough on

# tmux uses the default cursor style in copy mode, which is configured to be "bar" in Ghostty. Use a block cursor instead in copy mode.
set-hook -g after-copy-mode 'set -p cursor-style block'

# Dim the Claude Code idle dot from bright to dim green only after dwelling on the focused window for ~2s, so cycling past it (Ctrl+Tab) does not prematurely dim it.
set-hook -g after-select-window 'if -F "#{==:#{E:@claude-window-state},unread}" "run-shell -b \"@dismissClaudeIdle@ #{window_id}\""'

# Remember the keyword a rename adds, such as DOCS in nix-meridian@feature-x[DOCS], for the next cc session named feature-x.
set-hook -g window-renamed 'run-shell -b "@saveWindowKeyword@ #{q:window_name}"'

# No border arrows while a floating pane has focus.
# pane-border-indicators is read per window and its arrows hug the focused pane, so the window's value follows the focused pane.
set-hook -g window-pane-changed {
	if -F '#{pane_floating_flag}' { set -w pane-border-indicators colour } { set -wu pane-border-indicators }
}
