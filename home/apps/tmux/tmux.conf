set -g bell-action any
set -g repeat-time 325
set -g set-clipboard on
set -g visual-bell off

setw -g alternate-screen on
setw -g automatic-rename off
setw -g monitor-activity on
setw -g xterm-keys on

set -g set-titles on
set -g set-titles-string '#T - #S:#I:#W #{session_alerts}'

set -g buffer-limit 30

unbind C-z

unbind o
bind C-s select-pane -t :.+

unbind Up
unbind Down
unbind Left
unbind Right
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right
bind -r C-M-k resize-pane -U 5
bind -r C-M-j resize-pane -D 5
bind -r C-M-h resize-pane -L 5
bind -r C-M-l resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Cycle through windows like browser tabs; next-window and previous-window wrap around by default.
# Backward is C-BTab because tmux names Shift+Tab "BTab", so Ctrl+Shift+Tab is Ctrl+BTab (not Ctrl+Shift+Tab).
bind -n C-Tab  next-window
bind -n C-BTab previous-window

unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe 'wl-copy'

set -g mode-style                     fg=colour16,bg=colour220
set -g status-style                   fg=colour247

set -g pane-border-indicators         both
set -g pane-border-style              fg=colour238
set -g pane-active-border-style       fg=colour248
set -g message-style                  fg=colour39

setw -g window-status-activity-style  fg=colour251,bold
setw -g window-status-bell-style      fg=colour251,bold

setw -g status-left                   '#[fg=colour252,bg=colour244] #S #[fg=colour244,bg=colour232] '
setw -g status-right                  ' #[fg=colour244,bg=colour232]#[fg=colour252,bg=colour244] #h '
setw -g window-status-format          " #I│ #{?#{@claude-state},#{?#{==:#{@claude-state},blocked},#[fg=#ff0000]●#[fg=#9e9e9e] ,#{?#{==:#{@claude-state},working},#[fg=#ff9300]●#[fg=#9e9e9e] ,#{?#{==:#{@claude-state},idle-unread},#[fg=#00ff00]●#[fg=#9e9e9e] ,#[fg=#4cb24c]●#[fg=#9e9e9e] }}},}#W "
setw -g window-status-current-format  "#{?#{@claude-state},#{?#{==:#{@claude-state},blocked},#[fg=#000000]#[bg=#ff0000] #I│ #[fg=#990000]●#[fg=#000000] #W #[fg=#ff0000]#[bg=#080808],#{?#{==:#{@claude-state},working},#[fg=#000000]#[bg=#ff9300] #I│ #[fg=#995900]●#[fg=#000000] #W #[fg=#ff9300]#[bg=#080808],#{?#{==:#{@claude-state},idle-unread},#[fg=#000000]#[bg=#00ff00] #I│ #[fg=#009900]●#[fg=#000000] #W #[fg=#00ff00]#[bg=#080808],#[fg=#000000]#[bg=#4cb24c] #I│ #[fg=#009900]●#[fg=#000000] #W #[fg=#4cb24c]#[bg=#080808]}}},#[fg=#000000]#[bg=#00afff] #I│ #W #[fg=#00afff]#[bg=#080808]}"

set -g status-left-length  64
set -g status-right-length 64

set -ga terminal-features ",*:hyperlinks"
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -g allow-passthrough on

# tmux uses the default cursor style in copy mode, which is configured to be "bar" in Ghostty. Use a block cursor instead in copy mode.
set-hook -g after-copy-mode 'set -p cursor-style block'

# Dim the Claude Code idle dot from bright green to dim green only after dwelling on the focused window for ~2s,
# so cycling past it (Ctrl+Tab) does not prematurely dim it.
set-hook -g after-select-window 'if -F "#{==:#{@claude-state},idle-unread}" "run-shell -b \"@dismissClaudeIdle@ #{window_id}\""'
