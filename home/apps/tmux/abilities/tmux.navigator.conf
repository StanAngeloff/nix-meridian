# prefix Tab: the navigator, a sidebar of every window in every session (the design is in navigator/control.py).
# Closed, prefix Tab opens it focused; open, it takes focus from any other pane; pressed in the navigator, it closes.
# It replaces tmux 3.8's own prefix Tab window switcher, which moves to prefix w below; prefix BTab still chooses sessions.

# tmux 3.8's default prefix Tab, verbatim: a floating window switcher along the bottom. It takes the place of
# choose-tree on prefix w.
bind-key w new-pane -E -X 0 -Y 0 -x "75%" -y "30%" \; move-pane -P bottom-centre \; switch-mode -kw

set -g @navigator-width 36
set -g @navigator-min-width 100

# The window's column, holding the navigator or a placeholder, recognised by its start command (navigator/model.py).
set -g @navigator-column '#{P:#{?#{m:*/bin/tmux-navigator*,#{pane_start_command}},#{pane_id},}}'
# The status bar while the navigator is open (tmux.conf's status-left and status-style): blank under the navigator, a
# │ right below its border, and a faint tint beside the pane. The width is the navigator's own in the window on screen,
# so the line follows a dragged border; padding takes a computed width only in its p- form (p#{…} is not parsed).
# A zoomed window shows one pane and no border, so it has no width here and its bar is drawn as without the navigator.
set -g @navigator-blank ''
set -g @navigator-here-width '#{?window_zoomed_flag,,#{P:#{?#{==:#{pane_id},#{@navigator-pane}},#{pane_width},}}}'
# The │ takes the colour tmux gives the bottom of the border. With exactly two tiled panes (floating ones do not count),
# tmux lights the half of the border nearer the active pane, so the bottom is lit when the pane beside the navigator is
# active; with more, it lights the border beside the active pane, so the bottom is lit when the navigator or the pane
# meeting the bottom of the border is active. A floating pane with focus leaves the border unlit.
set -g @navigator-line-lit '#{?pane_floating_flag,,#{?#{==:#{P:#{?#{pane_floating_flag},,1}},11},#{!=:#{pane_id},#{@navigator-pane}},#{||:#{==:#{pane_id},#{@navigator-pane}},#{&&:#{==:#{pane_left},#{e|+:#{E:@navigator-here-width},1}},#{==:#{pane_bottom},#{e|-:#{window_height},1}}}}}}'
# The blank and the │ take bg=terminal, the terminal's own background: in the bar, default is the bar's tint.
set -g @navigator-status-left '#{?#{E:@navigator-here-width},#[bg=terminal]#{p-#{E:@navigator-here-width}:@navigator-blank}#[fg=#{?#{E:@navigator-line-lit},colour248,colour238}]│#[default],}'
# Non-empty while the navigator's pane exists; it goes with the window it was in.
set -g @navigator-alive '#{S:#{W:#{P:#{?#{==:#{pane_id},#{@navigator-pane}},1,}}}}'
# A helper pane, which works for other panes and has no directory or work of its own: a navigator column, or the
# issue board that prefix C-i splits off (issues-toggle.sh tags it @issues-board).
set -g @navigator-helper-pane '#{||:#{m:*/bin/tmux-navigator*,#{pane_start_command}},#{@issues-board}}'
# The pane a pane-scoped binding should act on: the pressed pane, or, pressed in a helper pane, the pane used last in
# its window (pane_last), else the window's first pane that is neither a helper nor floating. Both loops list their
# panes with a trailing space, and the first word wins. Used by prefix C-g and G (tmux.tig.conf), prefix C-i and I
# (tmux.issues.conf) and prefix C-n (tmux.scratch-note.conf).
set -g @navigator-target-pane '#{?#{E:@navigator-helper-pane},#{s/ .*//:#{P:#{?#{&&:#{pane_last},#{?#{E:@navigator-helper-pane},,1}},#{pane_id} ,}}#{P:#{?#{||:#{E:@navigator-helper-pane},#{pane_floating_flag}},,#{pane_id} }}},#{pane_id}}'

bind-key Tab {
	if -F '#{&&:#{@navigator-open},#{==:#{pane_id},#{@navigator-pane}}}' {
		run-shell -b '@navigator@ close'
	} {
		if -F '#{&&:#{@navigator-open},#{&&:#{@navigator-pane},#{==:#{E:@navigator-column},#{@navigator-pane}}}}' {
			run-shell -C 'select-pane -t #{@navigator-pane}'
		} {
			run-shell -b '@navigator@ toggle #{pane_id} #{client_name} #{session_name}'
		}
	}
}

# prefix Space, in place of next-layout's seven presets in turn: the even layouts for the window's number of panes,
# one after the other, each press evening out the one on screen first (navigator/layout.py, cycled),
# whether the navigator is open or not; its column keeps its width. Pressed in a helper pane, it acts for the last used.
# Not in the background, so a press made while one is running waits for it and starts from its layout.
bind-key Space run-shell '@navigator@ arrange #{E:@navigator-target-pane}'

# Any window switch (a key, a click, prefix w, a closed window) brings the navigator along: it swaps places with the
# placeholder of the window now on screen, so neither window resizes. A window without a column, or a navigator that
# went with its window, is left to the script. Slot 90 keeps these apart from the hooks in tmux.conf.
# Only switches in @navigator-session count: the phone switches in its own session, grouped with default, and its
# windows shrink to the phone only after this hook has run, so their width cannot tell them apart here.
set-hook -g 'session-window-changed[90]' {
	if -F '#{&&:#{@navigator-open},#{==:#{session_name},#{@navigator-session}}}' {
		if -F '#{&&:#{E:@navigator-alive},#{E:@navigator-column}}' {
			if -F '#{!=:#{E:@navigator-column},#{@navigator-pane}}' {
				run-shell -C 'swap-pane -d -Z -s #{@navigator-pane} -t #{E:@navigator-column}'
				# A window left with the navigator focused keeps that spot active for the placeholder that takes its place,
				# so coming back would focus the navigator again; a switch made outside the navigator lands in the content.
				if -F '#{==:#{pane_id},#{@navigator-pane}}' {
					run-shell -C 'select-pane -t #{E:@navigator-target-pane}'
				}
				run-shell -b 'kill -WINCH #{P:#{?#{==:#{pane_id},#{@navigator-pane}},#{pane_pid},}} 2>/dev/null || true'
			}
		} {
			run-shell -b '@navigator@ arrive #{window_id}'
		}
	}
}

# The switch keys in tmux.conf (Ctrl+Tab, Ctrl+Shift+Tab, Alt+1…9, prefix n and p) and prefix c, for its new window,
# do the hook's swap before the switch instead, as Enter in the navigator does (navigator/control.py, go),
# so the target window appears with the navigator already in its column; the hook then finds it there and does nothing.
# Swapping after the switch shows a frame in between, the target's empty placeholder over a bar without its tint and │:
# the hook needs run-shell -C to expand pane IDs,
# and tmux redraws every client while run-shell -C waits for its turn of the event loop.
# Bound as run-shell -t <target window> -C '#{E:@navigator-switch}': the formats evaluate in the target window, and the
# redraw before the commands run has nothing new to show. Only switches in @navigator-session count, as in the hook.
set -g @navigator-switching '#{&&:#{@navigator-open},#{==:#{session_name},#{@navigator-session}}}'
# The target window has a column, and the navigator is alive and elsewhere.
set -g @navigator-swap-needed '#{&&:#{E:@navigator-alive},#{&&:#{E:@navigator-column},#{!=:#{E:@navigator-column},#{@navigator-pane}}}}'
# The navigator's process wherever it is, for the SIGWINCH that has it redraw at once after a move.
set -g @navigator-pid '#{S:#{W:#{P:#{?#{==:#{pane_id},#{@navigator-pane}},#{pane_pid} ,}}}}'
# Swap, switch, and, like the hook, hand focus to the content of a target left with the navigator focused: its
# placeholder holds that spot, so the navigator would arrive focused. The window is named by index in the current
# session, which @navigator-switching has checked is the navigator's.
set -g @navigator-switch '#{?#{E:@navigator-swap-needed},swap-pane -d -Z -s #{@navigator-pane} -t #{E:@navigator-column} ; ,}select-window -t :#{window_index}#{?#{E:@navigator-swap-needed},#{?#{==:#{pane_id},#{E:@navigator-column}}, ; select-pane -t #{E:@navigator-target-pane},} ; run-shell -b "kill -WINCH #{E:@navigator-pid}2>/dev/null || true",}'

# A wide client moving to another session (prefix s, choose-tree) takes the navigator along.
set-hook -g 'client-session-changed[90]' {
	if -F '#{&&:#{@navigator-open},#{e|>=:#{client_width},#{@navigator-min-width}}}' {
		run-shell -b '@navigator@ arrive #{window_id} #{session_name}'
	}
}

# A window left with only its column closes, as it would without the navigator: Claude Code quitting, prefix x.
# pane-exited formats see the session's current window, so the condition is evaluated again in the exited pane's own
# window; the doubled ## survive the first expansion. after-kill-pane has no hook window, and prefix x acts on the
# window on screen, which is the one its formats see.
# A command run by a hook fires no hooks itself, so the window that comes on screen after such a kill-window is not
# announced: the script then puts the navigator into whichever windows are on screen, and does nothing when it is there.
# When the window left is the one on screen with only the navigator (Ctrl+D in its last shell),
# the navigator first swaps into the column of the window tmux shows next, the last window (!), and lives on there;
# otherwise it would go with the window, and the next window would show an empty column until a new navigator started.
# Tokens name the panes, as run-shell -C would show the navigator stretched across the window before its commands ran;
# a ! that names no window falls back to the current one, so the window_last_flag check comes first.
set-hook -g 'pane-exited[90]' {
	if -F '#{@navigator-open}' {
		if -F '#{&&:#{E:@navigator-switching},#{&&:#{==:#{window_panes},1},#{&&:#{==:#{pane_id},#{@navigator-pane}},#{W:#{?window_last_flag,1,}}}}}' {
			if -F -t '!.{top-left}' '#{==:#{pane_id},#{E:@navigator-column}}' {
				swap-pane -d -Z -s ':.' -t '!.{top-left}'
			}
			kill-window
			run-shell -b 'kill -WINCH #{E:@navigator-pid}2>/dev/null || true'
		} {
			run-shell -C 'if -F -t #{hook_window} "##{&&:##{==:##{window_panes},1},##{E:@navigator-column}}" "kill-window -t #{hook_window}"'
		}
		run-shell -b '@navigator@ arrive'
	}
}
set-hook -g 'after-kill-pane[90]' {
	if -F '#{&&:#{@navigator-open},#{&&:#{==:#{window_panes},1},#{E:@navigator-column}}}' {
		run-shell -C 'kill-window -t #{window_id}'
		run-shell -b '@navigator@ arrive'
	}
}

# A window narrower than @navigator-min-width, such as one the phone is showing, drops its column, and gets it back
# once it is wide again. The condition only lets through a resize that crosses the width, as resizes come in floods.
set-hook -g 'window-resized[90]' {
	if -F '#{&&:#{@navigator-open},#{?#{e|<:#{window_width},#{@navigator-min-width}},#{E:@navigator-column},#{?#{E:@navigator-column},,1}}}' {
		run-shell -b '@navigator@ resized #{hook_window}'
	}
}
