# Open the issue store's board in a split to the right, on the journal the window is named after; pressing again closes it (issues-toggle.sh).
# prefix C-i fires only while Ghostty reports Ctrl+I apart from Tab (extended-keys); prefix I does the same on any terminal.
bind-key C-i run-shell -b "@issuesToggle@ '#{window_id}' '#{pane_id}'"
bind-key I run-shell -b "@issuesToggle@ '#{window_id}' '#{pane_id}'"
