# Open a scratch note scoped to the current pane.
# Notes persist on disk at ~/.cache/tmux-scratch-notes/ keyed by pane ID and the PID of its initial process,
# so recycled pane IDs across tmux restarts never collide.
# Inside the tig popup (scratch session), notes open as a bottom split and are scoped to the pane that launched tig.
bind-key C-n \
  if-shell -F "#{==:#{session_name},scratch}" { \
    run-shell -b "tmux split-window -v -l 20% -t scratch '@scratchNote@ #{@caller-pane-id} #{@caller-pane-pid}'" \
  } { \
    run-shell -b "tmux display-popup -EE \
      -T ' scratch note ' \
      -xC -yC -w 70% -h 60% \
      -b rounded \
      -s 'bg=#101016' \
      -S 'bg=#101016,fg=#6f6f8f' \
      '@scratchNote@ #{pane_id} #{pane_pid}'" \
  }
