# Open a scratch note in a popup, scoped to the current pane.
# Notes persist on disk at ~/.cache/tmux-scratch-notes/ keyed by pane ID and the PID of its initial process,
# so recycled pane IDs across tmux restarts never collide.
bind-key C-n \
  run-shell -b "tmux display-popup -EE \
    -T ' scratch note ' \
    -xC -yC -w 70% -h 60% \
    -b rounded \
    -s 'bg=#101016' \
    -S 'bg=#101016,fg=#6f6f8f' \
    '@scratchNote@ #{pane_id} #{pane_pid}'"
