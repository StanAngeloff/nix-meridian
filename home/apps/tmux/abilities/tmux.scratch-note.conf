# Open a scratch note scoped to the current pane, in a floating pane (floats/scratch-note-float.sh).
# Notes persist on disk at ~/.cache/tmux-scratch-notes/ keyed by pane ID and the PID of its initial process,
# so recycled pane IDs across tmux restarts never collide.
# Inside tig, notes are scoped to the pane that opened tig.
bind-key C-n run-shell -b "@scratchNoteFloat@ '#{pane_id}' '#{client_name}'"
