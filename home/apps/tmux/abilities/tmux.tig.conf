# Open tig status in a popup window.
# Learn more at https://man7.org/linux/man-pages/man1/tmux.1.html#:~:text=target%2Dpane.-,display%2Dpopup,-%5B%2DBCE%5D%20%5B
bind-key C-g \
  if-shell -F "#{==:#{session_name},scratch}" { \
    detach-client \
  } { \
    run-shell -b "tmux display-popup -EE -d \"#{?@tig_path,#{@tig_path},#{pane_current_path}}\" -xC -yC -w 90% -h 90% -b rounded -s \"bg=#100610\" -S \"bg=#100610,fg=#8f6f8f\" 'tmux attach-session -t scratch 2>/dev/null || tmux new-session -s scratch -n \"tig-normal\" \"tig status +$( expr 4 + $( git diff --staged --name-only | wc -l ) )\" \\; set status off \\;'" \
  }

# Toggle popup or pane zoom.
bind -n M-z \
  if-shell -F "#{==:#{session_name}:#{window_name},scratch:tig-normal}" { \
    run-shell -C detach-client ; \
    run-shell -b "tmux display-popup -EE -d \"#{?@tig_path,#{@tig_path},#{pane_current_path}}\" -xC -yC -w 100% -h 100% -B -s \"bg=#100610\" -S \"bg=#100610,fg=#8f6f8f\" 'tmux attach-session -t scratch \\\; rename-window -t scratch:tig-normal tig-zoomed'" ; \
  } { \
    if-shell -F "#{==:#{session_name}:#{window_name},scratch:tig-zoomed}" { \
      run-shell -C detach-client ; \
      run-shell -b "tmux display-popup -EE -d \"#{?@tig_path,#{@tig_path},#{pane_current_path}}\" -xC -yC -w 90% -h 90% -b rounded -s \"bg=#100610\" -S \"bg=#100610,fg=#8f6f8f\" 'tmux attach-session -t scratch \\\; rename-window -t scratch:tig-zoomed tig-normal'" ; \
    } { \
      resize-pane -Z \
    } \
  }

# Pick a working path for tig (sets @tig_path per-pane).
bind-key G \
  run-shell -b "tmux display-popup -EE -d '#{pane_current_path}' -xC -yC -w 60% -h 60% -b rounded -s 'bg=#100610' -S 'bg=#100610,fg=#8f6f8f' 'PANE=#{pane_id}; current_path=\"#{@tig_path}\"; current_relative=\$(realpath --relative-to=. \"\$current_path\" 2>/dev/null); new_path=\$( { [ -n \"\$current_relative\" ] && [ -d \"./\$current_relative\" ] && echo \"./\$current_relative\"; find . -maxdepth 3 -type d -not -path \"*/node_modules/*\" -not -path \"*/.git/*\" 2>/dev/null | sort | if [ -n \"\$current_relative\" ]; then grep -xvF \"./\$current_relative\"; else cat; fi; } | fzf --prompt=\"tig path> \"); rc=\$?; if [ \$rc -ne 0 ]; then true; elif [ \"\$new_path\" = \".\" ]; then tmux set-option -pu -t \$PANE @tig_path; tmux kill-session -t scratch 2>/dev/null; else tmux set-option -p -t \$PANE @tig_path \"\$(realpath \"\$new_path\")\"; tmux kill-session -t scratch 2>/dev/null; fi; true'"
