# Open tig status in a floating pane, one per window; pressing again shades it to a strip in the top-right corner and back (floats/tig-float.sh).
bind-key C-g run-shell -b "@tigFloat@ '#{window_id}' '#{pane_id}' '#{client_name}'"

# Toggle popup or pane zoom.
bind -n M-z \
  if-shell -F "#{==:#{session_name}:#{window_name},scratch:tig-normal}" { \
    run-shell -C detach-client ; \
    run-shell -b "tmux display-popup -EE \
      -T \" #[bold]tig#[nobold] #{?@tig_path,#{@tig_path},#{pane_current_path}} \" \
      -d \"#{?@tig_path,#{@tig_path},#{pane_current_path}}\" \
      -xC -yC -w 100% -h 100% -B \
      -s \"bg=#100610\" \
      -S \"bg=#100610,fg=#8f6f8f\" \
      'tmux attach-session -t scratch \\\; rename-window -t scratch:tig-normal tig-zoomed'" ; \
  } { \
    if-shell -F "#{==:#{session_name}:#{window_name},scratch:tig-zoomed}" { \
      run-shell -C detach-client ; \
      run-shell -b "tmux display-popup -EE \
        -T \" #[bold]tig#[nobold] #{?@tig_path,#{@tig_path},#{pane_current_path}} \" \
        -d \"#{?@tig_path,#{@tig_path},#{pane_current_path}}\" \
        -xC -yC -w 90% -h 90% \
        -b rounded \
        -s \"bg=#100610\" \
        -S \"bg=#100610,fg=#8f6f8f\" \
        'tmux attach-session -t scratch \\\; rename-window -t scratch:tig-zoomed tig-normal'" ; \
    } { \
      resize-pane -Z \
    } \
  }

# Pick a working path for tig (sets @tig_path per-pane), in a floating pane (floats/tig-path.sh).
# Inside tig it targets the pane that opened tig; a pick closes the window's tig, so the next prefix C-g opens it there.
bind-key G run-shell -b "@tigPath@ '#{window_id}' '#{pane_id}' '#{client_name}'"
