# Open tig status in a popup window.
# Learn more at https://man7.org/linux/man-pages/man1/tmux.1.html#:~:text=target%2Dpane.-,display%2Dpopup,-%5B%2DBCE%5D%20%5B
bind-key C-g \
  if-shell -F "#{==:#{session_name},scratch}" { \
    detach-client \
  } { \
    run-shell -b "tmux display-popup -EE -d \"#{pane_current_path}\" -xC -yC -w 90% -h 90% -b rounded -s \"bg=#100610\" -S \"bg=#100610,fg=#8f6f8f\" 'tmux attach-session -t scratch 2>/dev/null || tmux new-session -s scratch -n \"tig-normal\" \"tig status +$( expr 4 + $( git diff --staged --name-only | wc -l ) )\" \\; set status off \\;'" \
  }

# Toggle popup or pane zoom.
bind -n M-z \
  if-shell -F "#{==:#{session_name}:#{window_name},scratch:tig-normal}" { \
    run-shell -C detach-client ; \
    run-shell -b "tmux display-popup -EE -d \"#{pane_current_path}\" -xC -yC -w 100% -h 100% -B -s \"bg=#100610\" -S \"bg=#100610,fg=#8f6f8f\" 'tmux attach-session -t scratch \\\; rename-window -t scratch:tig-normal tig-zoomed'" ; \
  } { \
    if-shell -F "#{==:#{session_name}:#{window_name},scratch:tig-zoomed}" { \
      run-shell -C detach-client ; \
      run-shell -b "tmux display-popup -EE -d \"#{pane_current_path}\" -xC -yC -w 90% -h 90% -b rounded -s \"bg=#100610\" -S \"bg=#100610,fg=#8f6f8f\" 'tmux attach-session -t scratch \\\; rename-window -t scratch:tig-zoomed tig-normal'" ; \
    } { \
      resize-pane -Z \
    }
  }
