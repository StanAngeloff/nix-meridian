# Claude Code traffic-light state, derived from the terminal title Claude Code writes about itself.
#
# Claude emits an OSC 0 title roughly once a second: a braille frame (U+2800-U+28FF) while a turn is running, and U+2733 "✳" once it ends. tmux parses that into #{pane_title}, so working and idle need no hook at all, and stay correct through subagents, workflows, and panes moved to another window — the title belongs to the Claude process rather than to the window it happens to sit in.
#
# Blocked cannot come from the title. Claude reports "✳" for the whole time a permission prompt is waiting, which is indistinguishable from a finished turn, so a hook latches @claude-blocked instead. A non-"✳" title outranks that latch below, and that ordering is what clears the dot the instant a prompt is approved: no hook reports an approval, and the next hook after a grant is PostToolUse, which fires only once the tool finishes.
#
# Pane options. Each is either set to 1 or absent, never set to 0, so the formats below test presence rather than content. The first three are written by claude-tmux-state from Claude Code hooks; the fourth is maintained by the pane-focus hooks at the end of this file.
#   @claude-pane     Claude Code is running in this pane
#   @claude-blocked  a prompt is waiting on you
#   @claude-unread   the last turn finished while you were not watching
#   @claude-focused  this pane currently holds focus

# Per-pane verdict: B blocked, W working, U finished and unread, R finished and read, empty when Claude is not running here.
# Working is tested as "the title does not start with ✳" rather than by matching a braille frame, because the spinner frame set is undocumented and matching the complement survives frames that have never been observed. The idle match deliberately does not require the space that always follows ✳ in practice, because a bare ✳ falling through to working would paint a blocked pane amber and hide a waiting prompt.
set -g @claude-pane-verdict '#{?#{@claude-pane},#{?#{m:✳*,#{pane_title}},#{?#{@claude-blocked},B,#{?#{@claude-unread},U,R}},W},}'

# Window rollup across the panes, in priority order blocked > working > unread > read.
# Working deliberately outranks unread here: a window standing in for several panes should report the liveliest thing inside it, and calling a window finished while one of its panes is still running would understate it. A binding that jumped to the next window needing attention would want the opposite order, blocked > unread > working > read, because that answers a different question — where should I go next, rather than what is this window doing.
set -g @claude-window-state '#{?#{m:*B*,#{P:#{E:@claude-pane-verdict}}},blocked,#{?#{m:*W*,#{P:#{E:@claude-pane-verdict}}},working,#{?#{m:*U*,#{P:#{E:@claude-pane-verdict}}},unread,#{?#{m:*R*,#{P:#{E:@claude-pane-verdict}}},read,}}}}'

# Maintain @claude-focused so a turn that finishes unwatched can be born unread. pane-focus-out fires both when focus moves to another pane and when the terminal window itself loses operating-system focus, and conflating the two is exactly right here: either way you were not watching. Requires focus-events, set via focusEvents in default.nix.
set-hook -g pane-focus-in  'set -p @claude-focused 1'
set-hook -g pane-focus-out 'set -pu @claude-focused'
